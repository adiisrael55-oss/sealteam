    :root{ --bg:#1a1a1e; --card:#26262b; --card2:#2e2e34; --text:#e8e6de; --text2:#b4b2a9; --text3:#7d7c76; --border:#3a3a40; --border2:#4a4a50; --success-bg:#1f352c; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo','Noto Sans Hebrew',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
  #app{max-width:760px;margin:0 auto;padding:10px}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--teal)}
  label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
  button{cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn-teal{background:var(--teal);color:#fff}
  .btn-red{background:var(--red);color:#fff}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
  .hdr{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);border-radius:16px;padding:20px 22px;margin-bottom:14px;color:#fff}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;border:1px solid}
  .b-teal{background:var(--tealbg);color:var(--teal);border-color:var(--tealbd)}
  .b-amber{background:var(--amberbg);color:var(--amber);border-color:#EF9F27}
  .b-red{background:var(--redbg);color:var(--red);border-color:#F09595}
  .b-orange{background:var(--orangebg);color:var(--orange);border-color:#F0A06A}
  .b-blue{background:var(--bluebg);color:var(--blue);border-color:#85B7EB}
  .b-purple{background:var(--purplebg);color:var(--purple);border-color:#AFA9EC}
  .b-gray{background:var(--card2);color:var(--text2);border-color:var(--border2)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
  .glass{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}
  .glass::placeholder{color:rgba(255,255,255,.4)}
  .glass-label{color:rgba(255,255,255,.5)!important}
  .tabs{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
  .tab{flex:1;padding:11px 4px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;background:var(--card2);color:var(--text2);border:none;border-bottom:3px solid transparent}
  .tab.active{background:var(--card);border-bottom-color:var(--teal)}
  .listitem{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:7px;cursor:pointer}
  .listitem:hover{border-color:var(--border2)}
  .spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:s 0.8s linear infinite;margin:40px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{text-align:center;padding:40px 20px;color:var(--text3)}
  video{width:100%;border-radius:12px;background:#000}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:30px;z-index:9999;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .mono{font-family:monospace;font-weight:600;letter-spacing:1px}
  .chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;background:var(--card2);border:1px solid var(--border);font-size:13px}

  .chk input{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0}
  .pill{padding:5px 11px;font-size:12px;border-radius:20px;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
  .pill.on{background:var(--tealbg);color:var(--teal);border-color:var(--tealbd)}
  .stat{text-align:center;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border)}
  .stat .v{font-size:24px;font-weight:700}
  .stat .l{font-size:11px;color:var(--text2)}
  canvas.sig{width:100%;height:110px;border-radius:10px;border:1.5px dashed var(--border2);background:var(--card2);touch-action:none;cursor:crosshair;display:block}

// ─── Init / Auth ───
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ state.user=session.user; await loadProfile(); await afterLogin(); }
  else renderAuth();
  sb.auth.onAuthStateChange((_e,s)=>{ if(!s){ state.user=null; state.profile=null; renderAuth(); } });
}
async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  state.profile = data || { role:'pending', full_name:state.user.email };
}
async function afterLogin(){
  if(!state.profile || state.profile.role==='pending'){ renderPending(); return; }
  await loadData(); render();
}
async function loadData(){
  const isMgr = state.profile.role==='manager';
  const reqs = [
    sb.from('rentals').select('*, rental_lines(*), motors(*)').order('created_at',{ascending:false}),
    sb.from('catalog').select('*').order('category').order('sku'),
    sb.from('warehouse').select('*'),
  ];
  if(isMgr) reqs.push(sb.from('profiles').select('*').order('created_at'));
  const res = await Promise.all(reqs);
  state.rentals = res[0].data||[];
  state.catalog = res[1].data||[];
  state.warehouse = {}; (res[2].data||[]).forEach(w=>state.warehouse[w.device_num]=w);
  state.profiles = isMgr ? (res[3].data||[]) : [];
  // photos — separate, tolerant if table not migrated yet
  const ph = await sb.from('rental_photos').select('*').order('created_at');
  const byR={}; (ph.data||[]).forEach(p=>{ (byR[p.rental_id]=byR[p.rental_id]||[]).push(p); });
  state.rentals.forEach(r=>{ r.rental_photos = byR[r.id]||[]; });
}

        </div>
      </div>
    </div>`;
  let isSignup=false;
  const $=id=>document.getElementById(id);
  $('toggleAuth').onclick=()=>{
    isSignup=!isSignup;
    $('authTitle').textContent=isSignup?'הרשמה':'התחברות';
    $('nameField').style.display=isSignup?'block':'none';
    $('authBtn').textContent=isSignup?'הירשם':'התחבר';
    $('toggleAuth').textContent=isSignup?'יש לך חשבון? התחבר':'אין לך חשבון? הירשם';
    $('authErr').textContent='';
  };
  $('authBtn').onclick=async()=>{
    const email=$('aEmail').value.trim(), pass=$('aPass').value, err=$('authErr');
    err.textContent=''; err.style.color='var(--red)';
    if(!email||!pass){ err.textContent='מלא אימייל וסיסמה'; return; }
    try{
      if(isSignup){
        const name=$('aName').value.trim();
        const { error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ full_name:name } } });
        if(error) throw error;
        err.style.color='var(--teal)';
        err.textContent='נרשמת! ממתין לאישור מנהל.';
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password:pass });
        if(error) throw error;
      }
      const { data:{ session } } = await sb.auth.getSession();
      if(session){ state.user=session.user; await loadProfile(); await afterLogin(); }
    }catch(e){ err.style.color='var(--red)'; err.textContent = e.message==='Invalid login credentials'?'אימייל או סיסמה שגויים':e.message; }
  };
}

// ─── Totals ───
function rentalTotal(r){
  const lt=(r.rental_lines||[]).reduce((s,l)=>s+(parseFloat(l.qty)||0)*(parseFloat(l.price)||0),0);
  return lt*(1-(r.discount||0)/100);
}
function motorCount(r){ return (r.motors||[]).filter(m=>m.device_num).length; }

}

// ─── Rentals list ───
function renderRentals(mc){
  const isMgr=state.profile.role==='manager';
  const totalRev=state.rentals.reduce((s,x)=>s+rentalTotal(x),0);
  const activeCount=state.rentals.filter(r=>r.status==='active').length;
  mc.innerHTML = `
    <div style="margin-bottom:12px"><input id="rSearch" placeholder="חיפוש לפי לקוח, אתר, או מס׳ מכשיר..." value="${esc(state._rsearch||'')}" style="padding:10px 14px;border-radius:12px"></div>
    <div id="rList"></div>`;
  const inp=document.getElementById('rSearch');
  inp.oninput=()=>{ state._rsearch=inp.value; drawRentalList(); };
  function drawRentalList(){
    const q=(state._rsearch||'').trim();
    const list=state.rentals.filter(r=>!q || (r.customer_name||'').includes(q) || (r.site||'').includes(q) || (r.motors||[]).some(m=>(m.device_num||'').includes(q)));
    const el=document.getElementById('rList');
    if(!list.length){ el.innerHTML=`<div class="center"><div style="font-size:32px">📋</div><div>אין השכרות</div><div style="font-size:12px">לחץ "+ חדש"</div></div>`; return; }
    el.innerHTML = list.map(r=>{
      const m=motorCount(r), tot=rentalTotal(r);
      return `<div class="listitem" data-id="${r.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <div style="font-weight:500;margin-bottom:3px">${esc(r.customer_name||'לקוח חדש')}${r.site?' — '+esc(r.site):''}</div>
            <div style="font-size:11px;color:var(--text3);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
              ${r.rental_num?`<span class="mono">${esc(r.rental_num)}</span>`:''}<span>${fmtD(r.date)}</span>
              ${m?`<span class="badge b-orange">${m} מנועים</span>`:''}
              ${r.start_signature?`<span class="badge b-teal">התחלה✓</span>`:''}
              ${r.end_signature?`<span class="badge b-blue">סיום✓</span>`:''}
            </div>
          </div>
          <div class="row" style="align-items:center;flex-shrink:0">
            <span class="badge ${r.status==='active'?'b-teal':r.status==='cancelled'?'b-red':'b-gray'}">${r.status==='active'?'פעיל':r.status==='cancelled'?'בוטל':'הושלם'}</span>
            ${tot>0?`<span class="badge b-amber">₪${Math.round(tot).toLocaleString()}</span>`:''}
            ${isMgr?`<button class="btn-ghost" data-del="${r.id}" style="padding:4px 9px">🗑</button>`:''}
          </div>
        </div>
      </div>`;
    }).join('');
    el.querySelectorAll('[data-id]').forEach(d=>d.onclick=ev=>{
      if(ev.target.closest('[data-del]')) return;
      state.current=state.rentals.find(x=>x.id===d.dataset.id); state.view='edit'; state.tab='start'; render();
    });
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async ev=>{
      ev.stopPropagation();
      if(!confirm('למחוק את ההשכרה לצמיתות?')) return;
      await sb.from('rentals').delete().eq('id',b.dataset.del);
      await loadData(); drawRentalList(); toast('נמחק');
    });
  }
  drawRentalList();
  if(state.rentals.length) mc.insertAdjacentHTML('beforeend',
    `<div style="margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--bluebg);border:1px solid #85B7EB;font-size:12px;color:var(--blue);display:flex;justify-content:space-between">
      <span>פעילות: ${activeCount}</span><span>סה״כ הכנסות: ₪${Math.round(totalRev).toLocaleString()}</span></div>`);
}

// ─── New rental ───
async function newRental(){
  const { data, error } = await sb.from('rentals').insert({
    date:today(), start_date:today(), status:'active',
    created_by:state.user.id, assigned_to:state.user.id,
    start_checklist:CK_START.map(l=>({label:l,checked:false})),
    end_checklist:CK_END.map(l=>({label:l,checked:false})),
    end_condition:CONDITIONS[0], scaffold_type:'פיגום תלוי', discount:0,
  }).select('*, rental_lines(*), motors(*)').single();
  if(error){ toast('שגיאה: '+error.message); return; }
  await sb.from('motors').insert([
    { rental_id:data.id, pair_index:0, motor_position:1, sku:'4501', start_date:today() },
    { rental_id:data.id, pair_index:0, motor_position:2, sku:'4501', start_date:today() },
  ]);
  await loadData();
  state.current=state.rentals.find(x=>x.id===data.id); state.view='edit'; state.tab='start'; render();
}

async function saveRentalField(field,value){
  state.current[field]=value;
  await sb.from('rentals').update({ [field]:value }).eq('id',state.current.id);
  const idx=state.rentals.findIndex(x=>x.id===state.current.id);
  if(idx>=0) state.rentals[idx][field]=value;
}
function refreshCurrent(){ state.current=state.rentals.find(x=>x.id===state.current.id); }

function pairsOf(r){
  const motors=(r.motors||[]).filter(m=>m.unit_kind!=='lift').slice().sort((a,b)=>(a.pair_index-b.pair_index)||(a.motor_position-b.motor_position));
  const pairs={}; motors.forEach(m=>{ (pairs[m.pair_index]=pairs[m.pair_index]||[]).push(m); });
  return pairs;
}
function liftUnits(r){ return (r.motors||[]).filter(m=>m.unit_kind==='lift').slice().sort((a,b)=>a.pair_index-b.pair_index); }
const LIFT_LABEL = m => (m.sku||'במה');

async function setMotorCondition(motorId,cv){
  const r=state.current, m=(r.motors||[]).find(x=>x.id===motorId);
  const c=MOTOR_CONDITIONS.find(x=>x.id===cv);
  await sb.from('motors').update({ condition:cv }).eq('id',motorId);
  if(m.device_num){
    const wh={ device_num:m.device_num, status:c.wh, last_update:new Date().toISOString() };
    if(cv!=='ok') wh.notes=m.fault_description||c.label;
    await sb.from('warehouse').upsert(wh);
  }
  await loadData(); refreshCurrent(); renderEdit();
}
async function returnUnit(motorId, cond){
  const r=state.current, m=(r.motors||[]).find(x=>x.id===motorId);
  const c=MOTOR_CONDITIONS.find(x=>x.id===cond)||MOTOR_CONDITIONS[0];
  await sb.from('motors').update({ end_date:today(), end_scan_timestamp:new Date().toISOString(), condition:cond }).eq('id',motorId);
  if(m.device_num){
    const wh={ device_num:m.device_num, status:c.wh, last_update:new Date().toISOString() };
    if(cond!=='ok') wh.notes=m.fault_description||c.label;
    await sb.from('warehouse').upsert(wh);
  }
  if(!r.end_date) await saveRentalField('end_date',today());
  if(!r.end_time) await saveRentalField('end_time',nowTime());
  await loadData(); refreshCurrent(); renderEdit();
  toast(cond==='ok'?'הוחזר ונכנס למחסן ✓':'הוחזר — נכנס למחסן לתיקון 🔧');
}
async function setMotorFault(motorId,desc){
  const r=state.current, m=(r.motors||[]).find(x=>x.id===motorId);
  await sb.from('motors').update({ fault_description:desc }).eq('id',motorId);
  if(m.device_num) await sb.from('warehouse').upsert({ device_num:m.device_num, status:'repair', notes:desc, last_update:new Date().toISOString() });
  await loadData(); refreshCurrent(); renderEdit();
}

function daysRow(label,days,est){
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--card);border-radius:8px;margin-bottom:5px">
    <span style="font-size:12px">${label}</span>
    <span class="badge ${est?'b-amber':'b-teal'}">${days} ימים${est?' (עד היום)':''}</span></div>`;
}
function daysSection(pairs,lifts){
  const pEntries=Object.entries(pairs).filter(([_,ms])=>ms.some(m=>m.start_date&&m.device_num));
  const lUnits=(lifts||[]).filter(m=>m.start_date&&m.device_num);
  if(!pEntries.length && !lUnits.length) return '';
  let grand=0;
  const pRows=pEntries.map(([pi,ms])=>{
    const withDev=ms.filter(m=>m.device_num);
    const days=Math.max(...withDev.map(m=>calcDays(m.start_date,m.end_date)||0),0);
    grand+=days;
    return daysRow(`זוג מנועים #${parseInt(pi)+1}`, days, withDev.some(m=>!m.end_date));

  const lRows=lUnits.map(m=>{
    const days=calcDays(m.start_date,m.end_date)||0; grand+=days;
    return daysRow(`🏗️ ${esc(LIFT_LABEL(m))} · ${esc(m.device_num)}`, days, !m.end_date);
  }).join('');
  const count=pEntries.length+lUnits.length;
  const totalLine=count>1?`<div style="display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:4px;padding:8px 12px;border-radius:10px;background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff"><span style="font-size:13px">סה״כ כל היחידות:</span><span style="font-size:20px;font-weight:700">${grand}</span><span style="font-size:11px;opacity:.7">ימי עבודה</span></div>`:'';

}

async function uploadPhoto(file, phase){
  const r=state.current;
  const ext=((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''))||'jpg';

  const up=await sb.storage.from('rental-photos').upload(path, file, { contentType:file.type||'image/jpeg' });
  if(up.error){ toast('שגיאת העלאה: '+up.error.message); return false; }

  if(ins.error){ toast('שגיאה: '+ins.error.message); return false; }

// ─── Signature canvas ───
function attachSignatures(tc){
  tc.querySelectorAll('canvas.sig').forEach(c=>{
    const field=c.dataset.sig;
    const ctx=c.getContext('2d');
    const ratio=window.devicePixelRatio||1;
    c.width=c.offsetWidth*ratio; c.height=c.offsetHeight*ratio; ctx.scale(ratio,ratio);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2.5;
    ctx.strokeStyle=matchMedia('(prefers-color-scheme:dark)').matches?'#e8e6de':'#1a1a2e';
    const val=state.current[field];
    if(val){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,c.offsetWidth,c.offsetHeight); img.src=val; }
    let drawing=false;
    const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?.[0]||e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
    const start=e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
    const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
    const end=()=>{if(!drawing)return;drawing=false;saveRentalField(field,c.toDataURL());};
    c.onmousedown=start; c.onmousemove=move; c.onmouseup=end; c.onmouseleave=end;
    c.ontouchstart=start; c.ontouchmove=move; c.ontouchend=end;
  });
  tc.querySelectorAll('[data-sigclear]').forEach(b=>b.onclick=async()=>{
    const field=b.dataset.sigclear;
    const c=tc.querySelector(`canvas[data-sig="${field}"]`);
    if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); }
    await saveRentalField(field,null); renderEdit();
  });
}

      kind:m.unit_kind==='lift'?'lift':'motor', sku:m.sku };
    if(!prev || (m.start_date||'')>=(prev.start||'')) map[m.device_num]=rec;
  }));

}

        <div style="font-size:13px;font-weight:600;color:var(--text3);padding:6px 4px;border-bottom:1px solid var(--border);margin-bottom:4px">${esc(cat)}</div>
        ${items.map(c=>`
          <div class="card" style="padding:8px 12px;margin-bottom:4px;display:flex;align-items:center;gap:8px">
            <input value="${esc(c.sku)}" data-cf="sku" data-cid="${c.id}" style="width:60px;padding:4px 6px;font-size:12px" class="mono">
            <input value="${esc(c.description)}" data-cf="description" data-cid="${c.id}" style="flex:2;padding:4px 6px;font-size:13px">
            <input value="${esc(c.unit)}" data-cf="unit" data-cid="${c.id}" style="width:50px;padding:4px 6px;font-size:12px;text-align:center">
            <input type="number" value="${c.price}" data-cf="price" data-cid="${c.id}" style="width:84px;padding:4px 6px;text-align:center;font-weight:600">
            <button class="btn-ghost" data-delcat="${c.id}" style="padding:4px 8px">🗑</button>
          </div>`).join('')}
        <button class="btn-ghost" data-addcat="${esc(cat)}" style="width:100%;padding:5px;font-size:12px">+ הוסף פריט</button>
      </div>`).join('')}`;

  const gd=document.getElementById('gd'), gdv=document.getElementById('gdv');
  gd.oninput=()=>gdv.textContent=gd.value+'%';
  document.getElementById('gdApply').onclick=async()=>{
    const pct=+gd.value; if(!pct) return;
    for(const c of state.catalog) await sb.from('catalog').update({ price:Math.round((c.price||0)*(1-pct/100)) }).eq('id',c.id);
    await loadData(); renderPrices(mc); toast('ההנחה הוחלה ✓');
  };
  mc.querySelectorAll('[data-cf]').forEach(i=>i.onchange=async()=>{
    const v = i.dataset.cf==='price' ? (parseFloat(i.value)||0) : i.value;
    await sb.from('catalog').update({ [i.dataset.cf]:v }).eq('id',i.dataset.cid);
    await loadData();
  });
  mc.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=async()=>{
    if(!confirm('למחוק פריט מהמחירון?')) return;
    await sb.from('catalog').delete().eq('id',b.dataset.delcat);
    await loadData(); renderPrices(mc);
  });
  mc.querySelectorAll('[data-addcat]').forEach(b=>b.onclick=async()=>{
    await sb.from('catalog').insert({ sku:'NEW', description:'פריט חדש', unit:'יח׳', price:0, category:b.dataset.addcat });
    await loadData(); renderPrices(mc);
  });
}

// ─── Barcode Scanner ───
function openScanner(onScan){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML=`<div style="width:100%;max-width:400px"><video id="scanVid" playsinline></video><div style="display:flex;gap:8px;margin-top:12px"><input id="manualCode" placeholder="או הקלד מס׳ מכשיר..." style="flex:1;background:#fff;color:#000"><button class="btn-teal" id="manualOk">אישור</button></div><button class="btn-ghost" id="closeScan" style="width:100%;margin-top:8px">ביטול</button></div>`;
  document.body.appendChild(ov);
  let stream, det, iv;
  const close=()=>{ if(iv)clearInterval(iv); if(stream)stream.getTracks().forEach(t=>t.stop()); ov.remove(); };
  document.getElementById('closeScan').onclick=close;
  document.getElementById('manualOk').onclick=()=>{ const v=document.getElementById('manualCode').value.trim(); if(v){ close(); onScan(v); } };
  document.getElementById('manualCode').onkeydown=e=>{ if(e.key==='Enter'){ const v=e.target.value.trim(); if(v){ close(); onScan(v); } } };
  (async()=>{
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const vid=document.getElementById('scanVid'); vid.srcObject=stream; vid.play();
      if('BarcodeDetector' in window){
        det=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','qr_code','upc_a','codabar','itf']});
        iv=setInterval(async()=>{ if(vid.readyState<2)return; try{ const b=await det.detect(vid); if(b.length){ close(); onScan(b[0].rawValue); } }catch{} },300);
      }
    }catch(e){ const f=document.getElementById('manualCode'); if(f) f.placeholder='הקלד מס׳ מכשיר (אין מצלמה)'; }
  })();
}

// ─── Excel: per-rental Priority export ───
function exportPriority(r){
  const rows=[]; let n=1;
  (r.rental_lines||[]).forEach(l=>{ if(!parseFloat(l.qty)) return;
    rows.push({"ש.":n++,'מק"ט':l.sku,"תאור מוצר":l.description,"מס' מכשיר":l.device_num||"","ת. התחלת השכרה":l.start_date?fmtD(l.start_date):fmtD(r.start_date),"ת. סיום השכרה":l.end_date?fmtD(l.end_date):"","כמות":parseFloat(l.qty)||1,"שכירות":parseFloat(l.rental_days)||0,"ימי שכירות בפועל":"","תעריף":parseFloat(l.price)||0});
  });
  (r.motors||[]).filter(m=>m.device_num).forEach(m=>{
    const lift=m.unit_kind==='lift';
    rows.push({"ש.":n++,'מק"ט':lift?m.sku:"4501","תאור מוצר":lift?('במת מספריים ZOOMLION '+m.sku):"מנוע משמלי פיגום תלוי","מס' מכשיר":m.device_num,"ת. התחלת השכרה":fmtD(m.start_date),"ת. סיום השכרה":m.end_date?fmtD(m.end_date):"","כמות":1,"שכירות":0,"ימי שכירות בפועל":"","תעריף":0});
  });
  if(!rows.length){ toast('אין נתונים לייצוא'); return; }
  const blank=k=>Object.fromEntries(Object.keys(rows[0]).map(x=>[x,""]));
  const info=[
    {...blank(),"ש.":'סייל טים בע"מ'},
    {...blank(),"ש.":`השכרה מספר: ${r.rental_num||'RN-'}`,"תאור מוצר":`לקוח: ${r.customer_name||''}`,"ת. התחלת השכרה":`תאריך: ${fmtD(r.date)}`},
    {...blank(),"ש.":`אתר: ${r.site||''} ${r.site_address||''}`,"תאור מוצר":`טלפון: ${r.customer_phone||''}`},
    blank(),
  ];
  const total=rows.reduce((s,x)=>s+((parseFloat(x["כמות"])||1)*(parseFloat(x["תעריף"])||0)),0);
  const all=[...info,...rows];
  if(r.discount) all.push({...blank(),"תאור מוצר":`הנחה: ${r.discount}%`,"תעריף":-Math.round(total*r.discount/100)});
  all.push({...blank(),"תאור מוצר":'סה"כ',"תעריף":Math.round(total*(1-(r.discount||0)/100))});
  const ws=XLSX.utils.json_to_sheet(all);
  ws['!cols']=[{wch:6},{wch:8},{wch:30},{wch:12},{wch:14},{wch:14},{wch:8},{wch:10},{wch:16},{wch:12}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'הדפסת השכרה');
  XLSX.writeFile(wb,`RN_${r.rental_num||r.customer_name||'rental'}_${fmtD(r.date)}.xlsx`);
}

// ─── REPORTS ───
function renderReports(mc){
  const customers=[...new Set(state.rentals.map(r=>r.customer_name).filter(Boolean))];
  mc.innerHTML=`
    <div class="card">
      <div style="font-weight:500;margin-bottom:8px">🔍 פילטרים</div>
      <div class="grid4">
        <div><label>מתאריך</label><input type="date" id="rptFrom" value="${state.rptFrom}"></div>
        <div><label>עד תאריך</label><input type="date" id="rptTo" value="${state.rptTo}"></div>
        <div><label>לקוח</label><select id="rptCust"><option value="">כל הלקוחות</option>${customers.map(c=>`<option ${state.rptCust===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label>סטטוס</label><select id="rptStatus">
          <option value="all" ${state.rptStatus==='all'?'selected':''}>הכל</option>
          <option value="active" ${state.rptStatus==='active'?'selected':''}>פעיל</option>
          <option value="completed" ${state.rptStatus==='completed'?'selected':''}>הושלם</option></select></div>
      </div>
    </div>
    <div class="grid2">
      ${REPORT_TYPES.map(rt=>`<button class="card" data-rpt="${rt.id}" style="cursor:pointer;text-align:right;display:block">
        <div class="row" style="align-items:center;margin-bottom:4px"><span style="font-size:18px">${rt.icon}</span><span style="font-size:13px;font-weight:600">${rt.label}</span></div>
        <div style="font-size:11px;color:var(--text3)">${rt.desc}</div></button>`).join('')}
    </div>
    <div class="card" style="margin-top:4px">
      <div style="font-weight:500;margin-bottom:8px">📈 סיכום מהיר</div>
      <div class="grid4">
        <div class="stat" style="color:var(--teal)"><div class="v">${state.rentals.filter(r=>r.status==='active').length}</div><div class="l">פעילות</div></div>
        <div class="stat" style="color:var(--orange)"><div class="v">${state.rentals.reduce((s,r)=>s+motorCount(r),0)}</div><div class="l">מנועים</div></div>
        <div class="stat" style="color:var(--amber)"><div class="v">${new Set(state.rentals.map(r=>r.customer_name).filter(Boolean)).size}</div><div class="l">לקוחות</div></div>
        <div class="stat" style="color:var(--teal)"><div class="v" style="font-size:16px">₪${Math.round(state.rentals.reduce((s,r)=>s+rentalTotal(r),0)).toLocaleString()}</div><div class="l">הכנסות</div></div>
      </div>
    </div>`;
  document.getElementById('rptFrom').onchange=e=>state.rptFrom=e.target.value;
  document.getElementById('rptTo').onchange=e=>state.rptTo=e.target.value;
  document.getElementById('rptCust').onchange=e=>state.rptCust=e.target.value;
  document.getElementById('rptStatus').onchange=e=>state.rptStatus=e.target.value;
  mc.querySelectorAll('[data-rpt]').forEach(b=>b.onclick=()=>exportReport(b.dataset.rpt));
}
function filterRentals(stOvr){
  let d=state.rentals.slice();
  const st=stOvr||state.rptStatus;
  if(st!=='all') d=d.filter(r=>r.status===st);
  if(state.rptCust) d=d.filter(r=>r.customer_name===state.rptCust);
  if(state.rptFrom) d=d.filter(r=>(r.date||'')>=state.rptFrom);
  if(state.rptTo) d=d.filter(r=>(r.date||'')<=state.rptTo);
  return d;
}
function rowOf(r){
  return { "מס׳ השכרה":r.rental_num||"", "שם לקוח":r.customer_name||"", "טלפון":r.customer_phone||"",
    "ח.פ/ע.מ":r.customer_tax_id||"", "אתר":r.site||"", "כתובת אתר":r.site_address||"",
    "ת. פתיחה":fmtD(r.date), "סטטוס":r.status==='active'?'פעיל':r.status==='completed'?'הושלם':'בוטל',
    "ת. התחלה":fmtD(r.start_date), "ת. סיום":fmtD(r.end_date),
    "מנועים":(r.motors||[]).filter(m=>m.device_num).map(m=>m.device_num).join(" , "),
    "שורות שירות":(r.rental_lines||[]).filter(l=>parseFloat(l.qty)>0).map(l=>`${l.sku} ${l.description}`).join(" | "),
    "הנחה %":r.discount||0, "סה״כ ₪":Math.round(rentalTotal(r)) };
}
function exportReport(type){
  let rows=[], sn='דוח';
  if(type==='active'){ rows=filterRentals('active').map(rowOf); sn='השכרות פעילות'; }
  else if(type==='bydate'){ rows=filterRentals().map(rowOf); sn='לפי תאריכים'; }
  else if(type==='bycustomer'){ rows=filterRentals().map(rowOf); sn=state.rptCust||'לפי לקוח'; }
  else if(type==='motors'){
    filterRentals().forEach(r=>(r.motors||[]).filter(m=>m.device_num).forEach(m=>{
      const lift=m.unit_kind==='lift';
      rows.push({"מס׳ מכשיר":m.device_num,'מק"ט':lift?m.sku:"4501","תאור":lift?('במת מספריים ZOOMLION '+m.sku):"מנוע משמלי פיגום תלוי","סוג":lift?'במת הרמה':'מנוע',"לקוח":r.customer_name,"אתר":r.site,"כתובת":r.site_address,"מס׳ השכרה":r.rental_num||"","ת. התחלה":fmtD(m.start_date),"ת. סיום":fmtD(m.end_date),"מצב":m.condition||"","סטטוס":r.status==='active'?'פעיל':'הושלם'});
    })); sn='מעקב מנועים';
  }
  else if(type==='financial'){
    const bc={}; filterRentals().forEach(r=>{ const k=r.customer_name||'לא מוגדר'; (bc[k]=bc[k]||{c:0,t:0,a:0}); bc[k].c++; bc[k].t+=rentalTotal(r); if(r.status==='active')bc[k].a++; });
    Object.entries(bc).forEach(([k,v])=>rows.push({"לקוח":k,"השכרות":v.c,"פעילות":v.a,"סה״כ ₪":Math.round(v.t)}));
    rows.sort((a,b)=>b["סה״כ ₪"]-a["סה״כ ₪"]);
    rows.push({"לקוח":"סה״כ","השכרות":rows.reduce((s,x)=>s+x["השכרות"],0),"פעילות":"","סה״כ ₪":rows.reduce((s,x)=>s+x["סה״כ ₪"],0)});
    sn='דוח כספי';
  }
  else if(type==='equipment'){
    filterRentals('active').forEach(r=>{
      (r.rental_lines||[]).filter(l=>parseFloat(l.qty)>0).forEach(l=>rows.push({'מק"ט':l.sku,"תאור":l.description,"כמות":parseFloat(l.qty)||1,"לקוח":r.customer_name,"אתר":r.site,"כתובת":r.site_address,"מס׳ השכרה":r.rental_num||"","תעריף ₪":parseFloat(l.price)||0}));
      (r.motors||[]).filter(m=>m.device_num).forEach(m=>{const lift=m.unit_kind==='lift';rows.push({'מק"ט':lift?m.sku:"4501","תאור":lift?('במת מספריים '+m.sku):"מנוע משמלי","כמות":1,"לקוח":r.customer_name,"אתר":r.site,"כתובת":r.site_address,"מס׳ השכרה":r.rental_num||"","תעריף ₪":0,"מס׳ מכשיר":m.device_num});});
    }); sn='ציוד באתרים';
  }
  else if(type==='priority'){
    let n=1; filterRentals().forEach(r=>{
      (r.rental_lines||[]).filter(l=>parseFloat(l.qty)>0).forEach(l=>rows.push({"ש.":n++,'מק"ט':l.sku,"תאור מוצר":l.description,"מס' מכשיר":"","ת. התחלת השכרה":fmtD(r.start_date),"ת. סיום השכרה":fmtD(r.end_date),"כמות":parseFloat(l.qty)||1,"לקוח":r.customer_name,"אתר":r.site,"מס׳ השכרה":r.rental_num||"","תעריף":parseFloat(l.price)||0}));
      (r.motors||[]).filter(m=>m.device_num).forEach(m=>{const lift=m.unit_kind==='lift';rows.push({"ש.":n++,'מק"ט':lift?m.sku:"4501","תאור מוצר":lift?('במת מספריים ZOOMLION '+m.sku):"מנוע משמלי פיגום תלוי","מס' מכשיר":m.device_num,"ת. התחלת השכרה":fmtD(m.start_date),"ת. סיום השכרה":fmtD(m.end_date),"כמות":1,"לקוח":r.customer_name,"אתר":r.site,"מס׳ השכרה":r.rental_num||"","תעריף":0});});
    }); sn='Priority Export';
  }
  if(!rows.length){ toast('אין נתונים עם הפילטרים הנוכחיים'); return; }
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.max(k.length+2,12)}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,sn.slice(0,31));
  XLSX.writeFile(wb,`sealteam_${type}_${today()}.xlsx`);
  toast('הדוח יוצא ✓');
}
